name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build deployment image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: memory-call:test
