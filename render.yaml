services:
  - type: web
    name: memory-call
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: STORAGE_DIR
        value: /app/storage
      - key: DEMO_SEED_MODE
        value: high_volume
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_MODEL
        value: gpt-5.6-terra
      - key: LLM_FAST_MODEL
        value: gpt-5.6-luna
      - key: LLM_REASONING_EFFORT
        value: low
      - key: LLM_FAST_REASONING_EFFORT
        value: none
      - key: LLM_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: ANAM_API_KEY
        sync: false
      - key: ANAM_AVATAR_ID
        sync: false
      - key: ANAM_AVATAR_NAME
        value: daewoongko
      - key: ANAM_AVATAR_MODEL
        value: cara-4
      - key: TURN_URLS
        sync: false
      - key: TURN_SHARED_SECRET
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
      - key: TTS_BRIDGE_TOKEN
        sync: false
