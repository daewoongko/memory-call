services:
  - type: web
    name: memory-call
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: STORAGE_DIR
        value: /app/storage
      - key: DEMO_SEED_MODE
        value: high_volume
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: LLM_MODEL
        value: gemini-3.5-flash
      - key: LLM_API_KEY
        sync: false
      - key: TTS_BRIDGE_TOKEN
        sync: false
