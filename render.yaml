services:
  - type: web
    name: memory-call
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: STORAGE_DIR
        value: /app/storage
      - key: DEMO_SEED_MODE
        value: high_volume
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: LLM_MODEL
        value: gemini-3.5-flash
      - key: LLM_FAST_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_REASONING_EFFORT
        value: low
      - key: LLM_FAST_REASONING_EFFORT
        value: ""
      - key: LLM_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: ANAM_API_KEY
        sync: false
      - key: ANAM_AVATAR_ID
        sync: false
      - key: ANAM_AVATAR_MODEL
        value: cara-4
      - key: TTS_BRIDGE_TOKEN
        sync: false
